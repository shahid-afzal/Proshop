services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    image: shahidafzal/proshop-api:latest
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    env_file: .env 
    environment:
      - MONGO_URI=mongodb://mongo:27017/proshop

  web:
    image: shahidafzal/proshop-web:latest
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongo_data:
services:
  api:
    image: shahidafzal/proshop-api:latest
    env_file: .env 
    environment:
      - MONGO_URI=${MONGO_URI}

  web:
    image: shahidafzal/proshop-web:latest
    depends_on:
      - api

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api